# Sensitivity of POD-CG and POD-JP on the spectral-3d family around c = 100 methods
# (CG k = 20, probes k = 10, 5000 generated rows): rank c in {50, 100, 200, 300} for both generators,
# POD-CG snapshot budget (560, 1120, 2230 and 5000 generated rows) and depth k = 40 for both. This
# case reports how the iterations,
# online cost and break-even move around it. Jacobi and aggregation AMG are the online anchors, so the
# break-even against them is comparable within this run. Every fit dataset pins the same held-out
# matrices (matrix-level split, same seed, every matrix bound).

[mlflow]
tracking_uri = "http://localhost:5000"

[comparison_baseline]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 5000
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_baseline.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_baseline.preconditioners]]
name = "amg-small-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.05 }

[[datasets]]
path = "../../datasets/train/spectral-3d-field/gaussian-cg20.toml"

[[datasets]]
path = "../../datasets/train/spectral-3d-field/smoother-filtered-probes.toml"

[[datasets]]
path = "../../datasets/train/spectral-3d-field/gaussian-cg40.toml"

[[datasets]]
path = "../../datasets/train/spectral-3d-field/smoother-filtered-probes-k40.toml"

[[dataset_sweeps]]
label = "cg-samples"
path_template = "../../datasets/train/spectral-3d-field/_generated/gaussian-cg20-samples-{value}.toml"
values = [560, 1120, 2230]

[[jobs]]
id = "pod_rank50"
path = "../../jobs/pod/r50.toml"

[[jobs]]
id = "pod_rank100"
path = "../../jobs/pod/pod-rank100.toml"
display_name = "POD (rank 100)"

[[jobs]]
id = "pod_rank200"
path = "../../jobs/pod/pod-rank200.toml"

[[jobs]]
id = "pod_rank300"
path = "../../jobs/pod/pod-rank300.toml"

# The dataset is a glob over many matrices (`*/K_ff.mtx`), so every recipe is one
# [[comparison_sweeps]] entry solving on all 20 matrices of the pinned test
# fold. Systems of one recipe form one reporting group.
[[comparison_sweeps]]
id_prefix = "gaussian"
display_name = "Gaussian RHS"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 20 }
rhs_source = { kind = "gaussian" }
seed = 42

[[comparison_sweeps]]
id_prefix = "gaussian-masked"
display_name = "Sparse Gaussian RHS"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 20 }
rhs_source = { kind = "gaussian", mask = { kind = "random", density = 0.1 } }
seed = 43

[[comparison_sweeps]]
id_prefix = "sinusoidal-low-freq"
display_name = "Sinusoidal RHS (low freq)"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 20 }
rhs_source = { kind = "sinusoidal", omega = 6.283185307179586 }
seed = 44

[[comparison_sweeps]]
id_prefix = "sinusoidal-high-freq"
display_name = "Sinusoidal RHS (high freq)"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 20 }
rhs_source = { kind = "sinusoidal", omega = 62.83185307179586 }
seed = 45

[[assignments]]
dataset = "gaussian-cg20-spectral-3d-field"
job = "pod_rank50"

[[assignments]]
dataset = "gaussian-cg20-spectral-3d-field"
job = "pod_rank100"

[[assignments]]
dataset = "gaussian-cg20-spectral-3d-field"
job = "pod_rank200"

[[assignments]]
dataset = "gaussian-cg20-spectral-3d-field"
job = "pod_rank300"

[[assignments]]
dataset = "smoother-filtered-probes-spectral-3d-field"
job = "pod_rank50"

[[assignments]]
dataset = "smoother-filtered-probes-spectral-3d-field"
job = "pod_rank100"

[[assignments]]
dataset = "smoother-filtered-probes-spectral-3d-field"
job = "pod_rank200"

[[assignments]]
dataset = "smoother-filtered-probes-spectral-3d-field"
job = "pod_rank300"

[[assignments]]
dataset = "gaussian-cg40-spectral-3d-field"
job = "pod_rank100"

[[assignments]]
dataset = "smoother-filtered-probes-k40-spectral-3d-field"
job = "pod_rank100"

[[assignment_sweeps]]
dataset_sweep = "cg-samples"
job = "pod_rank100"
