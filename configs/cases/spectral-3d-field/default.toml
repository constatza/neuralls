[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-Spectral3DField-POD-2G-CG"
comparison = "Compare-Spectral3DField-POD-2G-CG"

[comparison_baseline]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[comparison_baseline.timing]
repeats = 3

[[comparison_baseline.preconditioners]]
name = "identity"
type = "identity"

[[comparison_baseline.preconditioners]]
name = "jacobi"
type = "jacobi"

# TODO: "ilu" removed - comparisons on this case stall during its evaluation.
# Suspect torchalg's sparse ILU apply() path (level_schedule() is recomputed
# from a pure-Python per-row loop on every apply() call, not cached in
# setup()); root cause not yet confirmed. Re-add once diagnosed.

[[comparison_baseline.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_baseline.preconditioners]]
name = "amg-small-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.05 }

[[comparison_baseline.preconditioners]]
name = "amg-medium-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.25 }

[[comparison_baseline.preconditioners]]
name = "asa-few-candidates"
type = "adaptive_sa_amg"
num_candidates = 3
theta = 0.05

[[comparison_baseline.preconditioners]]
name = "bamg"
type = "bootstrap_amg"

[[datasets]]
path = "../../datasets/train/spectral-3d-field/gaussian-cg20.toml"

[[datasets]]
path = "../../datasets/train/spectral-3d-field/smoother-filtered-probes.toml"

[[jobs]]
id = "pod-2g_rank10"
path = "../../jobs/pod2g/pod2g-rank10.toml"
display_name = "POD-2G (rank 10)"

[[jobs]]
id = "pod-2g_rank100"
path = "../../jobs/pod2g/pod2g-rank100.toml"
display_name = "POD-2G (rank 100)"

# The dataset is a glob over many matrices (`*/K_ff.mtx`), so every recipe is one
# [[comparison_sweeps]] entry solving on the first 5 matrices of the pinned test
# fold. Systems of one recipe form one reporting group.
[[comparison_sweeps]]
id_prefix = "gaussian"
display_name = "Gaussian RHS"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 5 }
rhs_source = { kind = "gaussian" }
seed = 42

[[comparison_sweeps]]
id_prefix = "gaussian-masked"
display_name = "Sparse Gaussian RHS"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 5 }
rhs_source = { kind = "gaussian", mask = { kind = "random", density = 0.1 } }
seed = 43

[[comparison_sweeps]]
id_prefix = "sinusoidal-low-freq"
display_name = "Sinusoidal RHS (low freq)"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 5 }
rhs_source = { kind = "sinusoidal", omega = 6.283185307179586 }
seed = 44

[[comparison_sweeps]]
id_prefix = "sinusoidal-high-freq"
display_name = "Sinusoidal RHS (high freq)"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 5 }
rhs_source = { kind = "sinusoidal", omega = 62.83185307179586 }
seed = 45

[[assignments]]
dataset = "gaussian-cg20-spectral-3d-field"
job = "pod-2g_rank10"

[[assignments]]
dataset = "gaussian-cg20-spectral-3d-field"
job = "pod-2g_rank100"

[[assignments]]
dataset = "smoother-filtered-probes-spectral-3d-field"
job = "pod-2g_rank10"

[[assignments]]
dataset = "smoother-filtered-probes-spectral-3d-field"
job = "pod-2g_rank100"
