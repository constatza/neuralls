[mlflow]
tracking_uri = "http://localhost:5000"

[comparison_baseline]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 5000
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_baseline.preconditioners]]
name = "identity"
type = "identity"

[[comparison_baseline.preconditioners]]
name = "jacobi"
type = "jacobi"

# TODO: "ilu" removed - comparisons on this case stalled during its evaluation.
# The cause is not diagnosed; this comparison builds dense matrices and uses the
# dense ILU builder, so the sparse apply() path is not established as the culprit.
# Profile the dense build and solve before re-adding it.

[[comparison_baseline.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_baseline.preconditioners]]
name = "amg-small-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.05 }

[[comparison_baseline.preconditioners]]
name = "amg-medium-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.25 }

[[comparison_baseline.preconditioners]]
name = "asa-few-candidates"
type = "adaptive_sa_amg"
num_candidates = 3
theta = 0.05

[[comparison_baseline.preconditioners]]
name = "bamg"
type = "bootstrap_amg"

# Matrix source of the comparison sweeps only; no POD method is fitted on it.
[[datasets]]
path = "../../datasets/train/spectral-3d-field/gaussian-cg20.toml"

# POD-CG (k = 10) is fitted on 250 rows (280 generated), POD-JP (k = 20) on 2502 (2780 generated):
# the remainder allocation of rows over the 200 matrices decides how many land in the 180-matrix
# fit fold, and no generated count gives exactly 2500. Same [split] and seed for both, so both pin
# the same held-out matrices.
[[datasets]]
path = "../../datasets/train/spectral-3d-field/gaussian-cg10-n280.toml"

[[datasets]]
path = "../../datasets/train/spectral-3d-field/smoother-filtered-probes-k20-n2780.toml"

[[jobs]]
id = "pod_rank50"
path = "../../jobs/pod/r50.toml"
display_name = "POD (rank 50)"

# The dataset is a glob over many matrices (`*/K_ff.mtx`), so every recipe is one
# [[comparison_sweeps]] entry solving on all 20 matrices of the pinned test
# fold. Systems of one recipe form one reporting group.
[[comparison_sweeps]]
id_prefix = "gaussian"
display_name = "Gaussian RHS"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 20 }
rhs_source = { kind = "gaussian" }
seed = 42

[[comparison_sweeps]]
id_prefix = "gaussian-masked"
display_name = "Sparse Gaussian RHS"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 20 }
rhs_source = { kind = "gaussian", mask = { kind = "random", density = 0.1 } }
seed = 43

[[comparison_sweeps]]
id_prefix = "sinusoidal-low-freq"
display_name = "Sinusoidal RHS (low freq)"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 20 }
rhs_source = { kind = "sinusoidal", omega = 6.283185307179586 }
seed = 44

[[comparison_sweeps]]
id_prefix = "sinusoidal-high-freq"
display_name = "Sinusoidal RHS (high freq)"
matrix_dataset = "gaussian-cg20-spectral-3d-field"
selector = { kind = "first_n", n = 20 }
rhs_source = { kind = "sinusoidal", omega = 62.83185307179586 }
seed = 45

[[assignments]]
dataset = "gaussian-cg10-n280-spectral-3d-field"
job = "pod_rank50"

[[assignments]]
dataset = "smoother-filtered-probes-k20-n2780-spectral-3d-field"
job = "pod_rank50"
