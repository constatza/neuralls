[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-RectangularHighCondition-POD-2G-SampleSweep"
comparison = "Compare-RectangularHighCondition-POD-2G-SampleSweep"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

[[comparison_defaults.preconditioners]]
name = "amg-dim200"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 200 }

[[comparison_defaults.preconditioners]]
name = "amg-dim300"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 300 }

# pod-2g_0-cg/cg-10/cg-50 are fitted once per sample count via [[assignment_sweeps]]
# bound to the [[jobs]] below (a `run.type = "fit"` job per dataset). Each
# [[dataset_sweeps]] entry expands to one real [[datasets]] entry per value in
# `values` (dataset ids are read from those real files, same as any hand-written
# [[datasets]] entry — see scripts/expand_dataset_sweep.py and the sibling
# gaussian-{0cg,cg10,cg50}.sweep.toml files that generate the underlying configs).

[[dataset_sweeps]]
label = "0cg-samples"
path_template = "../../datasets/train/rectangular-high-condition/gaussian-0cg-{value}.toml"
values = [1000, 2000, 5000, 10000]

[[dataset_sweeps]]
label = "cg10-samples"
path_template = "../../datasets/train/rectangular-high-condition/gaussian-cg10-{value}.toml"
values = [1000, 2000, 5000, 10000]

[[dataset_sweeps]]
label = "cg50-samples"
path_template = "../../datasets/train/rectangular-high-condition/gaussian-cg50-{value}.toml"
values = [1000, 2000, 5000, 10000]

[[jobs]]
id = "pod-2g_0-cg"
path = "../../jobs/rectangular-high-condition/pod2g-0cg.toml"
display_name = "POD-2G (0-CG)"

[[jobs]]
id = "pod-2g_cg-10"
path = "../../jobs/rectangular-high-condition/pod2g-cg10.toml"
display_name = "POD-2G (CG-10)"

[[jobs]]
id = "pod-2g_cg-50"
path = "../../jobs/rectangular-high-condition/pod2g-cg50.toml"
display_name = "POD-2G (CG-50)"

[[comparisons]]
matrix_dataset = "gaussian-cg50-rectangular-high-condition-10000"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-rectangular-high-condition-10000"
rhs_source = { kind = "sparse", indices = [
    0,
    1,
    -1,
], values = [
    90.0,
    100.0,
    -100.0,
] }

[[assignment_sweeps]]
dataset_sweep = "0cg-samples"
job = "pod-2g_0-cg"

[[assignment_sweeps]]
dataset_sweep = "cg10-samples"
job = "pod-2g_cg-10"

[[assignment_sweeps]]
dataset_sweep = "cg50-samples"
job = "pod-2g_cg-50"
