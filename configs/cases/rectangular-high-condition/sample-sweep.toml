[[assignments]]
dataset = "gaussian-cg10-rectangular-high-condition-5000"
job = "pod-2g_cg-10"

[[assignments]]
dataset = "gaussian-cg10-rectangular-high-condition-10000"
job = "pod-2g_cg-10"

[[assignments]]
dataset = "gaussian-cg50-rectangular-high-condition-1000"
job = "pod-2g_cg-50"

[[assignments]]
dataset = "gaussian-cg50-rectangular-high-condition-2000"
