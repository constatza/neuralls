[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-RectangularHighCondition-POD-2G-SampleSweep"
comparison = "Compare-RectangularHighCondition-POD-2G-SampleSweep"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

[[comparison_defaults.preconditioners]]
name = "amg-dim200"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 200 }

[[comparison_defaults.preconditioners]]
name = "amg-dim300"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 300 }

# Every POD-2G rank (pod-2g_rank100/200/300, see [[jobs]] below) is fitted
# against every cg-variant's snapshots at every sample count — rank is a
# fit-time hyperparameter independent of which strategy/cg_iters produced
# the snapshot data, so it is deliberately tested against all of them, not
# just the variant its job happens to be named after. Each [[dataset_sweeps]]
# entry expands to one real [[datasets]] entry per value in `values` (dataset
# ids are read from those real files, same as any hand-written [[datasets]]
# entry — see scripts/expand_dataset_sweep.py and the sibling
# gaussian-{0cg,cg10,cg50}.sweep.toml files that generate the underlying
# configs). Kept as 3 separate dataset_sweeps blocks (one per cg-variant)
# because each variant uses a different generation strategy (gaussian_forward
# for 0-cg vs gaussian_residuals for cg-10/cg-50), which cannot be expressed
# as a single *.sweep.toml file (one strategy per dataset config) — see
# "Sweeping one dataset config..." in configs/README.md.

[[dataset_sweeps]]
label = "0cg-samples"
path_template = "../../datasets/train/rectangular-high-condition/gaussian-0cg-{value}.toml"
values = [1000, 5000, 10000]

[[dataset_sweeps]]
label = "cg10-samples"
path_template = "../../datasets/train/rectangular-high-condition/gaussian-cg10-{value}.toml"
values = [1000, 5000, 10000]

[[dataset_sweeps]]
label = "cg50-samples"
path_template = "../../datasets/train/rectangular-high-condition/gaussian-cg50-{value}.toml"
values = [1000, 5000, 10000]

[[jobs]]
id = "pod-2g_rank100"
path = "../../jobs/pod2g/pod2g-rank100.toml"
display_name = "POD-2G (rank 100)"

[[jobs]]
id = "pod-2g_rank200"
path = "../../jobs/pod2g/pod2g-rank200.toml"
display_name = "POD-2G (rank 200)"

[[jobs]]
id = "pod-2g_rank300"
path = "../../jobs/pod2g/pod2g-rank300.toml"
display_name = "POD-2G (rank 300)"

[[comparisons]]
matrix_dataset = "gaussian-cg50-rectangular-high-condition-10000"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-rectangular-high-condition-10000"
rhs_source = { kind = "sparse", indices = [
    0,
    1,
    -1,
], values = [
    90.0,
    100.0,
    -100.0,
] }

# Every job crossed with every dataset_sweep — see the comment above [[dataset_sweeps]].
[[assignment_sweeps]]
dataset_sweep = "0cg-samples"
job = ["pod-2g_rank100", "pod-2g_rank200", "pod-2g_rank300"]

[[assignment_sweeps]]
dataset_sweep = "cg10-samples"
job = ["pod-2g_rank100", "pod-2g_rank200", "pod-2g_rank300"]

[[assignment_sweeps]]
dataset_sweep = "cg50-samples"
job = ["pod-2g_rank100", "pod-2g_rank200", "pod-2g_rank300"]
