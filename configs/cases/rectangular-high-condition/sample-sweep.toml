[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-RectangularHighCondition-POD-2G-SampleSweep"
comparison = "Compare-RectangularHighCondition-POD-2G-SampleSweep"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

# The only searched axis is the training-set size: POD-2G (rank 100, see
# [[jobs]] below) is fitted against gaussian-cg50 snapshots at every sample
# count. Each [[dataset_sweeps]] entry expands to one real [[datasets]] entry
# per value in `values` (dataset ids are read from those real files — see
# scripts/expand_dataset_sweep.py and gaussian-cg50.sweep.toml, which
# generates the underlying configs).

[[dataset_sweeps]]
label = "cg50-samples"
path_template = "../../datasets/train/rectangular-high-condition/_generated/gaussian-cg50-{value}.toml"
values = [1000, 5000, 10000]

[[jobs]]
id = "pod-2g_rank100"
path = "../../jobs/pod2g/pod2g-rank100.toml"
display_name = "POD-2G (rank 100)"

[[comparisons]]
matrix_dataset = "gaussian-cg50-rectangular-high-condition-10000"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-rectangular-high-condition-10000"
rhs_source = { kind = "sparse", indices = [
    0,
    1,
    -1,
], values = [
    90.0,
    100.0,
    -100.0,
] }

[[assignment_sweeps]]
dataset_sweep = "cg50-samples"
job = "pod-2g_rank100"
