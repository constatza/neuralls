# POD parametric study, snapshot depth k (CG iterations or Jacobi sweeps) in {1, 2, 5, 10, 20}.
# Every dataset keeps only the last trajectory row (`start` unset), so no kept window holds row 0.
# Baseline: c = 100, k = 20 (POD-CG), k = 10 (POD-JP), N = 5000. Only POD-CG and POD-JP
# methods are compared; each swept value is its own method, labelled from its facts.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-RHC-POD-Depth"
comparison = "Compare-RHC-POD-Depth"

[comparison_baseline]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 5000
stopping_criterion = "residual_norm"
m_max = 20

[[datasets]]
path = "../../datasets/train/rectangular-high-condition/gaussian-cg20.toml"

[[datasets]]
path = "../../datasets/train/rectangular-high-condition/smoother-filtered-probes-nu10.toml"

[[datasets]]
path = "../../datasets/train/rectangular-high-condition/gaussian-cg10.toml"

[[dataset_sweeps]]
label = "cg-depth"
path_template = "../../datasets/train/rectangular-high-condition/_generated/gaussian-cg-depth-{value}.toml"
values = [1, 2, 5]

[[dataset_sweeps]]
label = "jp-depth"
path_template = "../../datasets/train/rectangular-high-condition/_generated/smoother-filtered-probes-depth-{value}.toml"
values = [1, 2, 5, 20]

[[jobs]]
id = "pod-c100"
path = "../../jobs/pod/pod-rank100.toml"

# 4 RHS recipes x 20 draws on the one RHC matrix: 80 systems per method.

[[comparisons]]
id = "gaussian"
matrix_dataset = "gaussian-cg20-rectangular-high-condition"
rhs_source = { kind = "gaussian" }
rhs_count = 20
seed = 42

[[comparisons]]
id = "masked-gaussian"
matrix_dataset = "gaussian-cg20-rectangular-high-condition"
rhs_source = { kind = "gaussian", mask = { kind = "random", density = 0.1 } }
rhs_count = 20
seed = 43

[[comparisons]]
id = "sinusoidal-low-freq"
matrix_dataset = "gaussian-cg20-rectangular-high-condition"
rhs_source = { kind = "sinusoidal", omega = 6.283185307179586 }
rhs_count = 20
seed = 44

[[comparisons]]
id = "sinusoidal-high-freq"
matrix_dataset = "gaussian-cg20-rectangular-high-condition"
rhs_source = { kind = "sinusoidal", omega = 62.83185307179586 }
rhs_count = 20
seed = 45

[[assignments]]
dataset = "gaussian-cg10-rectangular-high-condition"
job = "pod-c100"

[[assignments]]
dataset = "gaussian-cg20-rectangular-high-condition"
job = "pod-c100"

[[assignments]]
dataset = "smoother-filtered-probes-nu10-rectangular-high-condition"
job = "pod-c100"

[[assignment_sweeps]]
dataset_sweep = "cg-depth"
job = "pod-c100"

[[assignment_sweeps]]
dataset_sweep = "jp-depth"
job = "pod-c100"
