[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-Spheres1000x-POD-2G-CG"
comparison = "Compare-Spheres1000x-POD-2G-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

[[comparison_defaults.preconditioners]]
name = "amg-dim200"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 200 }

[[comparison_defaults.preconditioners]]
name = "amg-dim300"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 300 }

# pod-2g_rank100/200/300 are no longer declared here: they are now [[assignments]]
# bound to [[jobs]] pod-2g_rank100/200/300 below (a `run.type = "fit"` job per
# dataset), fitted once ahead of time and MLflow-tracked. Every job (rank) is
# crossed with every dataset (cg-variant) below — rank is a fit-time
# hyperparameter independent of which strategy/cg_iters produced the
# snapshots, so it is deliberately tested against all of them.

[[datasets]]
path = "../../datasets/train/spheres-1000x/gaussian-0cg.toml"

[[datasets]]
path = "../../datasets/train/spheres-1000x/gaussian-cg10.toml"

[[datasets]]
path = "../../datasets/train/spheres-1000x/gaussian-cg50.toml"

[[jobs]]
id = "pod-2g_rank100"
path = "../../jobs/pod2g/pod2g-rank100.toml"
display_name = "POD-2G (rank 100)"

[[jobs]]
id = "pod-2g_rank200"
path = "../../jobs/pod2g/pod2g-rank200.toml"
display_name = "POD-2G (rank 200)"

[[jobs]]
id = "pod-2g_rank300"
path = "../../jobs/pod2g/pod2g-rank300.toml"
display_name = "POD-2G (rank 300)"

[[comparisons]]
matrix_dataset = "gaussian-cg50-spheres-1000x"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-spheres-1000x"
rhs_source = { kind = "sparse", indices = [
    0,
    1,
    -1,
], values = [
    90.0,
    100.0,
    -100.0,
] }

[[assignments]]
dataset = "gaussian-0cg-spheres-1000x"
job = "pod-2g_rank100"

[[assignments]]
dataset = "gaussian-0cg-spheres-1000x"
job = "pod-2g_rank200"

[[assignments]]
dataset = "gaussian-0cg-spheres-1000x"
job = "pod-2g_rank300"

[[assignments]]
dataset = "gaussian-cg10-spheres-1000x"
job = "pod-2g_rank100"

[[assignments]]
dataset = "gaussian-cg10-spheres-1000x"
job = "pod-2g_rank200"

[[assignments]]
dataset = "gaussian-cg10-spheres-1000x"
job = "pod-2g_rank300"

[[assignments]]
dataset = "gaussian-cg50-spheres-1000x"
job = "pod-2g_rank100"

[[assignments]]
dataset = "gaussian-cg50-spheres-1000x"
job = "pod-2g_rank200"

[[assignments]]
dataset = "gaussian-cg50-spheres-1000x"
job = "pod-2g_rank300"
