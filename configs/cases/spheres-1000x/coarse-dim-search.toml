[mlflow]
tracking_uri = "http://localhost:5000"

[comparison_baseline]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 5000
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_baseline.preconditioners]]
name = "identity"
type = "identity"

[[comparison_baseline.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_baseline.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_baseline.preconditioners]]
name = "amg-dim10"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 10 }

[[comparison_baseline.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

[[comparison_baseline.preconditioners]]
name = "amg-dim200"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 200 }

[[comparison_baseline.preconditioners]]
name = "amg-dim300"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 300 }

[[datasets]]
path = "../../datasets/train/spheres-1000x/gaussian-cg50.toml"

[[jobs]]
id = "pod_rank10"
path = "../../jobs/pod/pod-rank10.toml"
display_name = "POD (rank 10)"

[[jobs]]
id = "pod_rank100"
path = "../../jobs/pod/pod-rank100.toml"
display_name = "POD (rank 100)"

[[jobs]]
id = "pod_rank200"
path = "../../jobs/pod/pod-rank200.toml"
display_name = "POD (rank 200)"

[[jobs]]
id = "pod_rank300"
path = "../../jobs/pod/pod-rank300.toml"
display_name = "POD (rank 300)"

[[comparisons]]
matrix_dataset = "gaussian-cg50-spheres-1000x"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-spheres-1000x"
rhs_source = { kind = "gaussian", mask = { kind = "random", density = 0.1 } }

[[assignments]]
dataset = "gaussian-cg50-spheres-1000x"
job = "pod_rank10"

[[assignments]]
dataset = "gaussian-cg50-spheres-1000x"
job = "pod_rank100"

[[assignments]]
dataset = "gaussian-cg50-spheres-1000x"
job = "pod_rank200"

[[assignments]]
dataset = "gaussian-cg50-spheres-1000x"
job = "pod_rank300"
