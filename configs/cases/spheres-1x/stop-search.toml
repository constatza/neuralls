[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-Spheres1x-POD-2G-StopSearch"
comparison = "Compare-Spheres1x-POD-2G-StopSearch"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

[[datasets]]
path = "../../datasets/train/spheres-1x/gaussian-cg0.toml"

[[datasets]]
path = "../../datasets/train/spheres-1x/_generated/gaussian-cg10.toml"

[[datasets]]
path = "../../datasets/train/spheres-1x/_generated/gaussian-cg50.toml"

[[jobs]]
id = "pod-2g_rank100"
path = "../../jobs/pod2g/pod2g-rank100.toml"
display_name = "POD-2G (rank 100)"

[[comparisons]]
matrix_dataset = "gaussian-cg50-spheres-1x"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-spheres-1x"
rhs_source = { kind = "sparse", indices = [
    0,
    1,
    -1,
], values = [
    90.0,
    100.0,
    -100.0,
] }

[[assignments]]
dataset = "gaussian-cg0-spheres-1x"
job = "pod-2g_rank100"

[[assignments]]
dataset = "gaussian-cg10-spheres-1x"
job = "pod-2g_rank100"

[[assignments]]
dataset = "gaussian-cg50-spheres-1x"
job = "pod-2g_rank100"
