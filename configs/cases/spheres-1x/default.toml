[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-Spheres1x-POD-2G-CG"
comparison = "Compare-Spheres1x-POD-2G-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

[[comparison_defaults.preconditioners]]
name = "amg-dim200"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 200 }

[[comparison_defaults.preconditioners]]
name = "amg-dim300"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 300 }

# pod-2g_0-cg/cg10/cg50 are no longer declared here: they are now [[assignments]]
# bound to [[jobs]] pod-2g_0-cg/cg10/cg50 below (a `run.type = "fit"` job per
# dataset), fitted once ahead of time and MLflow-tracked.

[[datasets]]
path = "../../datasets/train/spheres-1x/gaussian-0cg.toml"

[[datasets]]
path = "../../datasets/train/spheres-1x/gaussian-cg10.toml"

[[datasets]]
path = "../../datasets/train/spheres-1x/gaussian-cg50.toml"

[[jobs]]
id = "pod-2g_0-cg"
path = "../../jobs/spheres-1x/pod2g-0cg.toml"
display_name = "POD-2G (0-CG)"

[[jobs]]
id = "pod-2g_cg-10"
path = "../../jobs/spheres-1x/pod2g-cg10.toml"
display_name = "POD-2G (CG-10)"

[[jobs]]
id = "pod-2g_cg-50"
path = "../../jobs/spheres-1x/pod2g-cg50.toml"
display_name = "POD-2G (CG-50)"

[[comparisons]]
matrix_dataset = "gaussian-cg50-spheres-1x"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-spheres-1x"
rhs_source = { kind = "sparse", indices = [
    0,
    1,
    -1,
], values = [
    90.0,
    100.0,
    -100.0,
] }

[[assignments]]
dataset = "gaussian-0cg-spheres-1x"
job = "pod-2g_0-cg"

[[assignments]]
dataset = "gaussian-cg10-spheres-1x"
job = "pod-2g_cg-10"

[[assignments]]
dataset = "gaussian-cg50-spheres-1x"
job = "pod-2g_cg-50"
