[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Search-45x15-Scale-Equivariant-CG"
comparison = "Compare-45x15-Scale-Equivariant-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg"
type = "amg"
coarsening = { method = "aggregation" }

[[datasets]]
path = "../../datasets/train/45x15/gaussian-cg50.toml"
display_name = "Gaussian CG-50 45x15"

[[jobs]]
id = "scale-equivariant-constant-width-factorized-optuna"
path = "../../jobs/45x15/scale-equivariant-constant-width-factorized-optuna.toml"
display_name = "Scale Equivariant Constant Width FFNN Optuna Search"

[[jobs]]
id = "scale-equivariant-constant-width-factorized-relu-optuna"
path = "../../jobs/45x15/scale-equivariant-constant-width-factorized-relu-optuna.toml"
display_name = "Scale Equivariant Constant Width FFNN Optuna Search (ReLU)"

[[jobs]]
id = "scale-equivariant-embedded-factorized-optuna"
path = "../../jobs/45x15/scale-equivariant-embedded-factorized-optuna.toml"
display_name = "Scale Equivariant Embedded FFNN Optuna Search (GELU, bias)"

[[comparisons]]
matrix_dataset = "gaussian-cg50-45x15"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-45x15"
rhs_source = { kind = "sparse", indices = [
    0,
    1,
    -1,
], values = [
    90.0,
    100.0,
    -100.0,
] }

[[comparisons]]
matrix_dataset = "gaussian-cg50-45x15"
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[assignments]]
dataset = "gaussian-cg50-45x15"
job = "scale-equivariant-constant-width-factorized-optuna"

[[assignments]]
dataset = "gaussian-cg50-45x15"
job = "scale-equivariant-constant-width-factorized-relu-optuna"

[[assignments]]
dataset = "gaussian-cg50-45x15"
job = "scale-equivariant-embedded-factorized-optuna"
