[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-45x15randomE-POD-2G-CG"
comparison = "Compare-45x15randomE-POD-2G-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

[[comparison_defaults.preconditioners]]
name = "amg-dim200"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 200 }

[[comparison_defaults.preconditioners]]
name = "amg-dim300"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 300 }

# pod-2g_0-cg/cg10/cg50 are no longer declared here: they are now [[assignments]]
# bound to [[jobs]] pod-2g_0-cg/cg10/cg50 below (a `run.type = "fit"` job per
# dataset), fitted once ahead of time and MLflow-tracked.

[[datasets]]
path = "../../datasets/train/45x15randomE/gaussian-0cg.toml"
display_name = "Gaussian 0-CG 45x15randomE (POD-2G snapshots)"

[[datasets]]
path = "../../datasets/train/45x15randomE/gaussian-cg10.toml"
display_name = "Gaussian CG-10 45x15randomE (POD-2G snapshots)"

[[datasets]]
path = "../../datasets/train/45x15randomE/gaussian-cg50.toml"
display_name = "Gaussian CG-50 45x15randomE (POD-2G snapshots)"

[[datasets]]
path = "../../datasets/test/45x15randomE/gaussian-eval.toml"
display_name = "Gaussian Eval 45x15randomE (held-out eval matrices)"

[[jobs]]
id = "pod-2g_0-cg"
path = "../../jobs/45x15randomE/pod2g-0cg.toml"
display_name = "POD-2G (0-CG)"

[[jobs]]
id = "pod-2g_cg-10"
path = "../../jobs/45x15randomE/pod2g-cg10.toml"
display_name = "POD-2G (CG-10)"

[[jobs]]
id = "pod-2g_cg-50"
path = "../../jobs/45x15randomE/pod2g-cg50.toml"
display_name = "POD-2G (CG-50)"

## matrix_index below addresses rows of the gaussian-eval dataset (0..14, one row per
## excluded-from-training matrix — see configs/datasets/test/45x15randomE/gaussian-eval.toml),
## not raw family ids. 0/7/14 = first/middle/last of the 15 excluded matrices.

[[comparisons]]
id = "eval-0-gaussian"
display_name = "Eval matrix 0 | Gaussian RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
id = "eval-0-sparse"
display_name = "Eval matrix 0 | Sparse RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "eval-0-raw-lhs"
display_name = "Eval matrix 0 | Raw LHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[comparisons]]
id = "eval-7-gaussian"
display_name = "Eval matrix 7 | Gaussian RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 7
rhs_source = { kind = "gaussian" }
seed = 43

[[comparisons]]
id = "eval-7-sparse"
display_name = "Eval matrix 7 | Sparse RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 7
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "eval-7-raw-lhs"
display_name = "Eval matrix 7 | Raw LHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 7
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[comparisons]]
id = "eval-14-gaussian"
display_name = "Eval matrix 14 | Gaussian RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 14
rhs_source = { kind = "gaussian" }
seed = 44

[[comparisons]]
id = "eval-14-sparse"
display_name = "Eval matrix 14 | Sparse RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 14
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "eval-14-raw-lhs"
display_name = "Eval matrix 14 | Raw LHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 14
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[assignments]]
dataset = "gaussian-0cg-45x15randomE"
job = "pod-2g_0-cg"

[[assignments]]
dataset = "gaussian-cg10-45x15randomE"
job = "pod-2g_cg-10"

[[assignments]]
dataset = "gaussian-cg50-45x15randomE"
job = "pod-2g_cg-50"

