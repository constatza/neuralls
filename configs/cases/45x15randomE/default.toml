[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-45x15randomE-POD-2G-CG"
comparison = "Compare-45x15randomE-POD-2G-CG"

[comparison_baseline]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_baseline.preconditioners]]
name = "identity"
type = "identity"

[[comparison_baseline.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_baseline.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_baseline.preconditioners]]
name = "amg-small-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.05 }

[[comparison_baseline.preconditioners]]
name = "amg-medium-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.25 }

# [[comparison_baseline.preconditioners]]
# name = "asa-few-candidates"
# type = "adaptive_sa_amg"
# num_candidates = 3
# theta = 0.05

# [[comparison_baseline.preconditioners]]
# name = "asa-more-candidates"
# type = "adaptive_sa_amg"
# num_candidates = 7
# theta = 0.05

# [[comparison_baseline.preconditioners]]
# name = "bamg"
# type = "bootstrap_amg"

[[datasets]]
path = "../../datasets/train/45x15randomE/gaussian-cg10.toml"

[[datasets]]
path = "../../datasets/train/45x15randomE/smoother-filtered-probes.toml"

[[jobs]]
id = "pod-2g_rank10"
path = "../../jobs/pod2g/pod2g-rank10.toml"
display_name = "POD-2G (rank 10)"

[[jobs]]
id = "pod-2g_rank100"
path = "../../jobs/pod2g/pod2g-rank100.toml"
display_name = "POD-2G (rank 100)"

[[datasets]]
path = "../../datasets/test/45x15randomE/gaussian-eval.toml"

[[comparisons]]
id = "eval-0-gaussian"
display_name = "Eval matrix 0 | Gaussian RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
id = "eval-0-sparse"
display_name = "Eval matrix 0 | Sparse RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "eval-0-raw-lhs"
display_name = "Eval matrix 0 | Raw LHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[comparisons]]
id = "eval-0-sinusoidal-low-freq"
display_name = "Eval matrix 0 | Sinusoidal RHS (low freq)"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "sinusoidal", omega = 6.283185307179586 }
seed = 44

[[comparisons]]
id = "eval-0-sinusoidal-high-freq"
display_name = "Eval matrix 0 | Sinusoidal RHS (high freq)"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "sinusoidal", omega = 62.83185307179586 }
seed = 45

# Every [[comparisons]] entry in this file shares matrix_dataset =
# "gaussian-eval-45x15randomE", so all of them (gaussian, sparse, raw-lhs,
# sinusoidal alike) pool into one coarse (by-matrix) aggregation covering
# matrix indices 0, 1, 2, 3, 7, 14 — the real "N systems" projection,
# averaging solve cost across whatever RHS each system happened to use.
# The eval-*-gaussian entries additionally form their own finer
# (by-matrix-and-rhs-kind) group, reported separately — see
# composition/README.md's "comparison groups" section for why both
# granularities are computed and reported. eval-1/2/3 exist purely to
# grow the gaussian-only fine group past N=5; the coarse group already
# has 18 members without them.
[[comparisons]]
id = "eval-1-gaussian"
display_name = "Eval matrix 1 | Gaussian RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 1
rhs_source = { kind = "gaussian" }
seed = 42

