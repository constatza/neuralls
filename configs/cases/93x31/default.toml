[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-93x31-POD-2G-CG"
comparison = "Compare-93x31-POD-2G-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-dim10"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 10 }

[[comparison_defaults.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

[[datasets]]
path = "../../datasets/train/93x31/gaussian-cg10.toml"

[[datasets]]
path = "../../datasets/train/93x31/smoother-filtered-probes.toml"

[[jobs]]
id = "pod-2g_rank10"
path = "../../jobs/pod2g/pod2g-rank10.toml"
display_name = "POD-2G (rank 10)"

[[jobs]]
id = "pod-2g_rank100"
path = "../../jobs/pod2g/pod2g-rank100.toml"
display_name = "POD-2G (rank 100)"

[[comparisons]]
matrix_dataset = "gaussian-cg10-93x31"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg10-93x31"
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
matrix_dataset = "gaussian-cg10-93x31"
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[assignments]]
dataset = "gaussian-cg10-93x31"
job = "pod-2g_rank10"

[[assignments]]
dataset = "gaussian-cg10-93x31"
job = "pod-2g_rank100"

[[assignments]]
dataset = "smoother-filtered-probes-93x31"
job = "pod-2g_rank10"

[[assignments]]
dataset = "smoother-filtered-probes-93x31"
job = "pod-2g_rank100"
