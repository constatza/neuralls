[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-93x31-POD-2G-CG"
comparison = "Compare-93x31-POD-2G-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-dim100"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 100 }

[[comparison_defaults.preconditioners]]
name = "amg-dim200"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 200 }

[[comparison_defaults.preconditioners]]
name = "amg-dim300"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 300 }

# Every rank is fit from every cg-variant's snapshots — rank is a fit-time
# hyperparameter independent of which strategy/cg_iters produced the
# snapshots, so it is deliberately tested against all of them, not just the
# variant a rank historically happened to be paired with by name.

[[comparison_defaults.preconditioners]]
name = "pod-2g_rank100_0-cg"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-0cg-93x31", n_snapshots = -1, rank = 100 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_rank100_cg-10"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-cg10-93x31", n_snapshots = -1, rank = 100 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_rank100_cg-50"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-cg50-93x31", n_snapshots = -1, rank = 100 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_rank200_0-cg"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-0cg-93x31", n_snapshots = -1, rank = 200 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_rank200_cg-10"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-cg10-93x31", n_snapshots = -1, rank = 200 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_rank200_cg-50"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-cg50-93x31", n_snapshots = -1, rank = 200 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_rank300_0-cg"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-0cg-93x31", n_snapshots = -1, rank = 300 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_rank300_cg-10"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-cg10-93x31", n_snapshots = -1, rank = 300 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_rank300_cg-50"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-cg50-93x31", n_snapshots = -1, rank = 300 }

[[datasets]]
path = "../../datasets/train/93x31/gaussian-0cg.toml"

[[datasets]]
path = "../../datasets/train/93x31/gaussian-cg10.toml"

[[datasets]]
path = "../../datasets/train/93x31/gaussian-cg50.toml"

[[comparisons]]
matrix_dataset = "gaussian-cg50-93x31"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-93x31"
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
matrix_dataset = "gaussian-cg50-93x31"
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }
