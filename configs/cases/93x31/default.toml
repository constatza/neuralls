[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-93x31-POD-2G-CG"
comparison = "Compare-93x31-POD-2G-CG"

[comparison_baseline]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_baseline.preconditioners]]
name = "identity"
type = "identity"

[[comparison_baseline.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_baseline.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_baseline.preconditioners]]
name = "amg-small-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.05 }

[[comparison_baseline.preconditioners]]
name = "amg-medium-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.25 }

# [[comparison_baseline.preconditioners]]
# name = "asa-few-candidates"
# type = "adaptive_sa_amg"
# num_candidates = 3
# theta = 0.05

# [[comparison_baseline.preconditioners]]
# name = "asa-more-candidates"
# type = "adaptive_sa_amg"
# num_candidates = 7
# theta = 0.05

# [[comparison_baseline.preconditioners]]
# name = "bamg"
# type = "bootstrap_amg"

[[datasets]]
path = "../../datasets/train/93x31/gaussian-cg10.toml"

[[datasets]]
path = "../../datasets/train/93x31/smoother-filtered-probes.toml"

[[jobs]]
id = "pod-2g_rank10"
path = "../../jobs/pod2g/pod2g-rank10.toml"
display_name = "POD-2G (rank 10)"

[[jobs]]
id = "pod-2g_rank100"
path = "../../jobs/pod2g/pod2g-rank100.toml"
display_name = "POD-2G (rank 100)"

[[comparisons]]
matrix_dataset = "gaussian-cg10-93x31"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg10-93x31"
rhs_source = { kind = "gaussian", mask = { kind = "random", density = 0.1 } }

[[comparisons]]
matrix_dataset = "gaussian-cg10-93x31"
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[comparisons]]
id = "sinusoidal-low-freq"
matrix_dataset = "gaussian-cg10-93x31"
rhs_source = { kind = "sinusoidal", omega = 6.283185307179586 }
seed = 44

[[comparisons]]
id = "sinusoidal-high-freq"
matrix_dataset = "gaussian-cg10-93x31"
rhs_source = { kind = "sinusoidal", omega = 62.83185307179586 }
seed = 45

[[assignments]]
dataset = "gaussian-cg10-93x31"
job = "pod-2g_rank10"

[[assignments]]
dataset = "gaussian-cg10-93x31"
job = "pod-2g_rank100"

[[assignments]]
dataset = "smoother-filtered-probes-93x31"
job = "pod-2g_rank10"

[[assignments]]
dataset = "smoother-filtered-probes-93x31"
job = "pod-2g_rank100"
