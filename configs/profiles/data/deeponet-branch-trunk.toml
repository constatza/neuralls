[data]
name = "FlexibleDataset"
batch_size = 256
pin_memory = true
shuffle = true

# These ratios are not consulted: every job reads the split that generation
# pinned for its dataset, set by the dataset config's [split] section.
[data.splits]
test = 0.1
val = 0.1

[[data.features]]
name = "branch"
transforms = [
    { name = "MinMaxScaler", dim = [0, 1] },
]

[[data.features]]
name = "trunk"
transforms = [
    { name = "MinMaxScaler", dim = [0, 1] },
    { name = "Unsqueeze", dim = 1 },
]

[[data.targets]]
name = "y"
transforms = [
    { name = "MinMaxScaler", dim = [0, 1] },
    { name = "Unsqueeze", dim = 1 },
]

[data.module]
name = "ArrayDataModule"
