[data]
name = "FlexibleDataset"
batch_size = 256
pin_memory = false
shuffle = true

# val is forced to 0 for fit jobs by runtime_split_patcher.py (POD-2G has no
# training loop to serve a validation fold) regardless of what's set here, so
# this profile's jobs always train on 90% (1 - test).
[data.splits]
test = 0.1
val = 0.1

[data.module]
name = "ArrayDataModule"
