id = "gaussian-cg0-93x31"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# "0-CG": the true 0-CG case, x ~ N(mu, sigma) with
# b = A @ x and no CG solve at all. POD-2G fitting never sees the real
# archived displacement solutions - solution archives are comparison-only.
[[generation.strategy]]
name = "gaussian_forward"
samples = 5000

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
