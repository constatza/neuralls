id = "gaussian-cg0-93x31"

[source]
problem = "93x31"
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

# "0-CG": the true 0-CG case, x ~ N(mu, sigma) with
# b = A @ x and no CG solve at all. POD fitting never sees the real
# archived displacement solutions - solution archives are comparison-only.
[[generation.strategy]]
name = "gaussian_forward"
samples = 5000

# Only POD fit jobs read this dataset, and a fit has no training loop to
# serve a validation fold, so the dataset keeps none.
[split]
test_ratio = 0.1
val_ratio = 0.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
