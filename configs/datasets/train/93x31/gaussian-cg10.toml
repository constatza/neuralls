id = "gaussian-cg10-93x31"

[source]
problem = "93x31"
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 5000
stop = 10

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
