id = "gaussian-cg-spheres-50x"
id_template = "gaussian-cg{value}-spheres-50x"
filename_template = "gaussian-cg{value}.toml"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/spheres-50x.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 5000
stop = [10, 50]

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
