id = "gaussian-cg50-spheres-50x"

[source]
problem = "Spheres 50x"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/spheres-50x.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

[[generation.strategy]]
name = "cg_errors"
samples = 5000
stop = 50

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
