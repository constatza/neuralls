id = "gaussian-cg50-spheres-50x"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/spheres-50x.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 500
stop = 50
start = 0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
