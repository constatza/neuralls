id = "gaussian-cg0-spheres-50x"

[source]
problem = "Spheres 50x"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/spheres-50x.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

# "0-CG": the `stop` field on the residuals/trace strategies has a hard
# floor of 1 (and even stop=1 emits 2 rows per system - iteration 0 AND
# iteration 1, not just the untraced solution). gaussian_forward is the true
# 0-CG case - x ~ N(mu, sigma), b = A @ x, no CG solve at all.
# POD fitting never sees real archived solutions - those are comparison-only.
[[generation.strategy]]
name = "gaussian_forward"
samples = 5000

# Only POD fit jobs read this dataset, and a fit has no training loop to
# serve a validation fold, so the dataset keeps none.
[split]
test_ratio = 0.1
val_ratio = 0.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
