id = "gaussian-cg10-rectangular-high-condition-5000"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 5000
cg_iters = 10

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
