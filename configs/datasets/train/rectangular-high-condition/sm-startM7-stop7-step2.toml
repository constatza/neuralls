id = "rhc-sm-startM7-stop7-step2"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# Keep sweeps 1, 3, 5, and 7; sweep 0 remains excluded.
[[generation.strategy]]
name = "smoother_filtered_probes"
samples = 10000
start = -7
stop = 7
step = 2
probe_distribution = "gaussian"

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
