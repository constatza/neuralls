id = "gaussian-cg20-rows-energy-rectangular-high-condition"

[source]
problem = "Rectangular high condition"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

[[generation.strategy]]
name = "cg_errors"
samples = 5000
stop = 20
snapshot_scaling = { kind = "norm", norm = "energy", power = 1.0 }

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
