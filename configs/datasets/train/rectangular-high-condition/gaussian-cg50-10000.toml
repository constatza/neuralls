id = "gaussian-cg50-rectangular-high-condition-10000"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 10000
cg_iters = 50

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
