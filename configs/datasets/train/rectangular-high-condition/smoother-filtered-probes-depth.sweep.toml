id = "smoother-filtered-probes-depth-rectangular-high-condition"
id_template = "smoother-filtered-probes-nu{value}-rectangular-high-condition"

[source]
problem = "Rectangular high condition"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

[[generation.strategy]]
name = "jacobi_probes"
samples = 5000
stop = [1, 5, 20, 40]
probe_distribution = "gaussian"

# Only POD recipes read this dataset; the comparison fits their basis on the
# train fold, with no training loop to serve a validation fold, so it keeps none.
[split]
test_ratio = 0.1
val_ratio = 0.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
