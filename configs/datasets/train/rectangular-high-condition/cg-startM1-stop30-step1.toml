id = "rhc-cg-startM1-stop30-step1"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 10000
start = -1
stop = 30
step = 1

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
