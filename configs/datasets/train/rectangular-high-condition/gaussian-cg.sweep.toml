id = "gaussian-cg-rectangular-high-condition"
id_template = "gaussian-cg{value}-rectangular-high-condition"
filename_template = "gaussian-cg{value}.toml"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 5000
stop = [10, 50]

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
