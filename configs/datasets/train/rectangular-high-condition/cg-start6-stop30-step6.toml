id = "rhc-cg-start6-stop30-step6"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# Keep iterations 6, 12, 18, 24, and 30.
[[generation.strategy]]
name = "gaussian_residuals"
samples = 10000
start = 6
stop = 30
step = 6

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
