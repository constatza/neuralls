id = "smoother-filtered-probes-rectangular-high-condition"

[source]
problem = "Rectangular high condition"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

# Random probe vectors damped by weighted-Jacobi sweeps — the natural
# baseline to compare against is gaussian-cg0.toml (x ~ N(mu, sigma), no CG
# solve at all), not a cg10/cg50 dataset: both start from the same raw random
# vectors, and the only difference is whether smoothing is applied
# afterward. `stop` (CG's equivalent field) has no comparable meaning here —
# CG is Krylov-optimal and converges regardless of condition number, while
# weighted-Jacobi's convergence depends on rho(I - omega D^-1 A) being < 1,
# which is not guaranteed for a matrix specifically chosen for being
# high-condition — tying this `stop` to an unrelated algorithm's iteration
# count would not make this a fair comparison. See
# domain/generation/README.md's "Jacobi-Filtered Probes" section. `omega`
# is left unset, matching
# torchalg.preconditioners.implementations.amg.smoothers.JacobiSmoother's own
# default of auto-computing the damping per-matrix via its spectral-radius
# rule, so "smooth" means the same thing here as it does in POD's actual
# AMG V-cycle smoother. `start` is left unset (default: keep only
# the final, fully-damped sweep — the original behavior). `snapshot_scaling` is left unset
# (default: each row pair scaled to a unit l2 error norm).
[[generation.strategy]]
name = "jacobi_probes"
samples = 5000
stop = 15
probe_distribution = "gaussian"

# Only POD recipes read this dataset; the comparison fits their basis on the
# train fold, with no training loop to serve a validation fold, so it keeps none.
[split]
test_ratio = 0.1
val_ratio = 0.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
