id = "rhc-cg-start1-stop10-step2"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# Keep iterations 1, 3, 5, 7, and 9.
[[generation.strategy]]
name = "gaussian_residuals"
samples = 10000
start = 1
stop = 10
step = 2

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
