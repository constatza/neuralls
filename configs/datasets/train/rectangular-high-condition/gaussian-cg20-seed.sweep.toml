id = "gaussian-cg20-n1000-seed-rectangular-high-condition"
id_template = "gaussian-cg20-n1000-seed{value}-rectangular-high-condition"

[source]
problem = "Rectangular high condition"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

[[generation.strategy]]
name = "cg_errors"
samples = 1000
stop = 20
# Snapshot-seed replicates of the c = 100 baseline; the unswept dataset is the seed-42 replicate.
seed = [43, 44]

# Only POD recipes read this dataset; the comparison fits their basis on the
# train fold, with no training loop to serve a validation fold, so it keeps none.
[split]
test_ratio = 0.1
val_ratio = 0.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
