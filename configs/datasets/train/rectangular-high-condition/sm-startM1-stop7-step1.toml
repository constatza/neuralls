id = "rhc-sm-startM1-stop7-step1"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# Last-only baseline: keep sweep 7.
[[generation.strategy]]
name = "smoother_filtered_probes"
samples = 10000
start = -1
stop = 7
step = 1
probe_distribution = "gaussian"

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
