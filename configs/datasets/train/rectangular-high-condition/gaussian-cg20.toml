id = "gaussian-cg20-rectangular-high-condition"

[source]
problem = "Rectangular high condition"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/rectangular-high-condition.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

[[generation.strategy]]
name = "cg_errors"
samples = 5000
stop = 20

# Only POD fit jobs read this dataset, and a fit has no training loop to
# serve a validation fold, so the dataset keeps none.
[split]
test_ratio = 0.1
val_ratio = 0.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
