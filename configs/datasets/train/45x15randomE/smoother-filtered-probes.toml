id = "smoother-filtered-probes-45x15randomE"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/45x15randomE/stiffness/*_subdomain_1_Kaa.txt"
enumerate_by = "name"
parameters_paths = [
  "${NEURALLS_RAW_DIR}/SpectralData/45x15randomE/stiffness/*_YoungModuli_E1_E2_E3_E4.txt",
]
# Held out (last 15 matrices by enumerate_by="name" order) for
# configs/datasets/test/45x15randomE/gaussian-eval.toml — see configs/README.md.
exclude_indices = [85, 86, 87, 88, 89, 90, 91, 92, 93, 94, 95, 96, 97, 98, 99]

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# Random probe vectors damped by weighted-Jacobi sweeps — the natural
# baseline to compare against is gaussian-cg0.toml (x ~ N(mu, sigma), no CG
# solve at all), not a cg10/cg50 dataset: both start from the same raw random
# vectors, and the only difference is whether smoothing is applied
# afterward. `stop` (CG's equivalent field) has no comparable meaning here —
# CG is Krylov-optimal and converges regardless of condition number, while
# weighted-Jacobi's convergence depends on rho(I - omega D^-1 A) being < 1.
# See domain/generation/README.md's "Smoother-Filtered Probes" section.
# `omega` matches
# torchalg.preconditioners.implementations.amg.smoothers.JacobiSmoother's
# default, so "smooth" means the same thing here as it does in POD-2G's
# actual AMG V-cycle smoother. `start` is left unset (default: keep only
# the final, fully-damped sweep). No snapshot weighting is applied when
# fitting POD-2G from this dataset (raw, matching every other
# pod-2g_rank* job).
[[generation.strategy]]
name = "smoother_filtered_probes"
samples = 5000
stop = 15
omega = 0.67
probe_distribution = "gaussian"

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
