id = "gaussian-cg-depth-spectral-3d-field"
id_template = "gaussian-cg{value}-n1120-spectral-3d-field"

[source]
problem = "Spectral 3D field"
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/spectral-3d-field/*/K_ff.mtx"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

# `start` left unset (default -1): keeps only the last CG iterate's
# residual/error pair per trajectory.
# The depth-1 point keeps the iterate after one step, never trajectory row 0.
[[generation.strategy]]
name = "cg_errors"
# N = 1000 fit rows (180-matrix fit fold), the shared POD study baseline.
samples = 1120
stop = [1, 5, 10, 40]

# The POD fit has no training loop to serve a validation fold, so the
# dataset keeps none: 180 fit / 20 test matrices.
[split]
test_ratio = 0.1
val_ratio = 0.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
