id = "gaussian-cg10-spheres-1x"

[source]
problem = "Spheres 1x"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/spheres-1x.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

[[generation.strategy]]
name = "cg_errors"
samples = 5000
stop = 10

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
