id = "gaussian-cg-45x15"
id_template = "gaussian-cg{value}-45x15"
filename_template = "gaussian-cg{value}.toml"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 5000
stop = [10, 50]

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
