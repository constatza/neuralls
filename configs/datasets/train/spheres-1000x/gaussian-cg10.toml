id = "gaussian-cg10-spheres-1000x"

[source]
problem = "Spheres 1000x"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/spheres-1000x.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

[[generation.strategy]]
name = "cg_errors"
samples = 5000
stop = 10

# The POD fit has no training loop to serve a validation fold, so the
# dataset keeps none: 4500 fit / 500 test rows of the one matrix.
[split]
test_ratio = 0.1
val_ratio = 0.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
