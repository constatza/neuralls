id = "gaussian-cg10-spheres-rve-high-condition"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/spheres-rve-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 500
cg_iters = 10

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
