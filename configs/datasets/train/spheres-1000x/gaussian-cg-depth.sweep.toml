id = "gaussian-cg-depth-spheres-1000x"
id_template = "gaussian-cg{value}-spheres-1000x"

[source]
problem = "Spheres 1000x"
matrix_path = "${NEURALLS_RAW_DIR}/matrices/spheres-1000x.txt"

[generation]
scaling = { kind = "gershgorin", dimension_factor = "sqrt_n" }
shuffle = true
seed = 42

[[generation.strategy]]
name = "cg_errors"
samples = 5000
stop = [20, 100]

# Only POD recipes read this dataset; the comparison fits their basis on the
# train fold, with no training loop to serve a validation fold, so it keeps none.
[split]
test_ratio = 0.1
val_ratio = 0.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
