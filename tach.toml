source_roots = ["src"]
root_module = "forbid"
ignore_type_checking_imports = true
layers_explicit_depends_on = true

layers = [
    "entrypoints",
    "composition",
    "application",
    "platform",
    "domain",
    "shared",
]

[[modules]]
path = "neuralls"
depends_on = []

[[modules]]
path = "neuralls.cli"
layer = "entrypoints"
depends_on = ["neuralls.composition", "neuralls.composition.**", "neuralls.shared", "neuralls.shared.**"]

[[modules]]
path = "neuralls.composition"
layer = "composition"
depends_on = [
    "neuralls.composition.**",
    "neuralls.application",
    "neuralls.application.**",
    "neuralls.platform",
    "neuralls.platform.**",
    "neuralls.domain",
    "neuralls.domain.**",
    "neuralls.shared",
    "neuralls.shared.**",
]

[[modules]]
paths = [
    "neuralls.composition.comparison",
    "neuralls.composition.config",
    "neuralls.composition.assignments",
    "neuralls.composition.generation",
    "neuralls.composition.inference",
    "neuralls.composition.preconditioners",
    "neuralls.composition.tracking",
]
layer = "composition"
depends_on = [
    "neuralls.composition.**",
    "neuralls.application",
    "neuralls.application.**",
    "neuralls.platform",
    "neuralls.platform.**",
    "neuralls.domain",
    "neuralls.domain.**",
    "neuralls.shared",
    "neuralls.shared.**",
]

[[modules]]
path = "neuralls.application"
layer = "application"
depends_on = ["neuralls.application.**", "neuralls.domain", "neuralls.domain.**", "neuralls.shared", "neuralls.shared.**"]

[[modules]]
paths = [
    "neuralls.application.inference",
]
layer = "application"
depends_on = ["neuralls.application.**", "neuralls.domain", "neuralls.domain.**", "neuralls.shared", "neuralls.shared.**"]

[[modules]]
path = "neuralls.platform"
layer = "platform"
depends_on = ["neuralls.platform.**", "neuralls.domain", "neuralls.domain.**", "neuralls.shared", "neuralls.shared.**"]

[[modules]]
paths = [
    "neuralls.platform.config",
    "neuralls.platform.config.models",
    "neuralls.platform.dlkit",
    "neuralls.platform.reporting",
    "neuralls.platform.sparse_io",
    "neuralls.platform.storage",
    "neuralls.platform.tracking",
]
layer = "platform"
depends_on = ["neuralls.platform.**", "neuralls.domain", "neuralls.domain.**", "neuralls.shared", "neuralls.shared.**"]

[[modules]]
path = "neuralls.domain"
layer = "domain"
depends_on = ["neuralls.domain.**", "neuralls.shared", "neuralls.shared.**"]

[[modules]]
paths = [
    "neuralls.domain.analysis",
    "neuralls.domain.generation",
    "neuralls.domain.generation.strategies",
    "neuralls.domain.solver",
    "neuralls.domain.solver.models",
    "neuralls.domain.solver.utils",
]
layer = "domain"
depends_on = ["neuralls.domain.**", "neuralls.shared", "neuralls.shared.**"]

[[modules]]
path = "neuralls.shared"
layer = "shared"
depends_on = ["neuralls.shared.**"]
