name: Dependency Graphs

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-target-matrix:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - id: targets
        name: Define graph targets
        run: |
          targets='[{"name":"overview","root":"neuralls","context":""},{"name":"cli","root":"neuralls.cli","context":"neuralls.composition,neuralls.shared"},{"name":"application","root":"neuralls.application","context":"neuralls.domain,neuralls.shared"},{"name":"composition","root":"neuralls.composition","context":"neuralls.application,neuralls.platform,neuralls.domain,neuralls.shared"},{"name":"domain","root":"neuralls.domain","context":"neuralls.shared"},{"name":"platform","root":"neuralls.platform","context":"neuralls.domain,neuralls.shared"},{"name":"shared","root":"neuralls.shared","context":""}]'
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

  check-boundaries:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: latest
          save-cache: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Python
        run: uv python install 3.14

      - name: Synchronize dependencies
        run: uv sync --dev

      - name: Check Tach boundaries
        run: uv run tach check

  render-target-graphs:
    needs: [prepare-target-matrix, check-boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-target-matrix.outputs.targets) }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: latest
          save-cache: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Synchronize dependencies
        run: uv sync --dev

      - name: Generate dependency graph for ${{ matrix.target.name }}
        run: |
          mkdir -p .tmp/dgraphs
          uv run tach map -o /tmp/neuralls-map.json
          uv run python scripts/render_actual_dependency_graph.py /tmp/neuralls-map.json .tmp/dgraphs/${{ matrix.target.name }}.dot ${{ matrix.target.root }} "${{ matrix.target.context }}"
          dot -Tsvg .tmp/dgraphs/${{ matrix.target.name }}.dot -o .tmp/dgraphs/${{ matrix.target.name }}.svg

      - name: Upload dependency graph for ${{ matrix.target.name }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph-${{ matrix.target.name }}
          path: .tmp/dgraphs
          if-no-files-found: error
