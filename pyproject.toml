[project]
name = "neuralls"
version = "0.1.0"
description = "Learned neural preconditioners for Conjugate Gradient on sparse linear systems, benchmarked against classical preconditioners"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    #    "bokeh>=3.8.0",
    "dlkit[cu130]",
    "loguru>=0.7.3",
    "numba>=0.63.1",
    "platformdirs>=4.0",
    "prefect-dask>=0.3.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "scipy-stubs==1.16.2.0",
    "seaborn>=0.13.2",
    "tcl>=0.2",
    "tomli-w>=1.0.0",
    "torchalg",
    "h5py>=3.0",
    "zarr>=3.2.0",
    "torch>=2.8.0,<2.10.0",
    "typer>=0.19.2",
]

[project.scripts]
neuralls = "neuralls.cli.main:app"

[build-system]
requires = ["uv_build>=0.10", "uv_build<0.15"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "D",  # pydocstyle
]
ignore = [
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D103", # undocumented-public-function
    "D104", # undocumented-public-package
    "D107", # undocumented-public-init
    "D417", # undocumented-param
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"tests/**/__init__.py" = ["D"]
# Explicit re-export facade (PEP 484 `X as X` idiom for mypy/ty's
# --strict re-export checking) — PLC0414 doesn't recognize this convention
# and would otherwise strip the entire re-export block as "useless"; isort
# (I001) also mishandles repeated same-module `X as X` aliases, proposing
# to split one clean block into six single-name imports.
"src/neuralls/composition/config.py" = ["PLC0414", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "hypothesis>=6.151.6",
    "pytest>=9.0",
    "ruff>=0.13.1",
    "tach>=0.34.0",
    "ty>=0.0.22",
]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.src]
include = ["src/neuralls", "tests", "scripts"]
respect-ignore-files = true

[tool.ty.environment]
root = ["src", "."]
python-version = "3.14"
python-platform = "all"

[tool.ty.rules]
redundant-cast = "error"
unused-type-ignore-comment = "error"

[[tool.ty.overrides]]
include = ["tests"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
unknown-argument = "ignore"

[tool.ty.terminal]
output-format = "concise"
error-on-warning = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-m", "not benchmark"]
markers = [
    "slow: tests that take >5 seconds (deselect with '-m \"not slow\"')",
    "benchmark: numerical algorithm benchmarks and exactness tests",
    "integration: integration tests that test full workflows",
]

[tool.uv]
package = true

[tool.uv.sources]
dlkit = { git = "https://github.com/constatza/dlkit.git", branch = "develop" }
torchalg = { git = "https://github.com/constatza/torchalg.git" }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
